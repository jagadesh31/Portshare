services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portshare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - portshare-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portshare"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - portshare

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PORTSHARE_ROOT_DOMAIN: ${PORTSHARE_ROOT_DOMAIN:?PORTSHARE_ROOT_DOMAIN is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      PORT: 9080
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portshare
    ports:
      - "9080:9080"

volumes:
  portshare-db:

networks:
  portshare:
    driver: bridge