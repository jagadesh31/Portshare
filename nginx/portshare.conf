map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream portshare_backend {
    server 127.0.0.1:9080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.portshare.kexoz.dev *.portshare.kexoz.dev;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.portshare.kexoz.dev;

    ssl_certificate /etc/letsencrypt/live/portshare.kexoz.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portshare.kexoz.dev/privkey.pem;

    location / {
        proxy_pass http://portshare_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.portshare.kexoz.dev;

    ssl_certificate /etc/letsencrypt/live/portshare.kexoz.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portshare.kexoz.dev/privkey.pem;

    location / {
        proxy_pass http://portshare_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
