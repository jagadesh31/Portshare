name: Release Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Frontend Dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build Frontend
        working-directory: desktop/frontend
        run: npm run build
        env:
          VITE_PORTSHARE_API_BASE: "https://api.portshare.kexoz.dev"
          VITE_PORTSHARE_ROOT_DOMAIN: "portshare.kexoz.dev"

      - name: Install Electron Dependencies
        working-directory: desktop/electron
        run: npm ci

      - name: Build Installer
        working-directory: desktop/electron
        run: npm run make
        env:
          VITE_PORTSHARE_API_BASE: "https://api.portshare.kexoz.dev"
          VITE_PORTSHARE_ROOT_DOMAIN: "portshare.kexoz.dev"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: desktop/electron/out/make/squirrel.windows/x64/PortShare-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
