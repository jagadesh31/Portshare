name: Release Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  VITE_PORTSHARE_API_BASE: "https://api.portshare.kexoz.dev"
  VITE_PORTSHARE_ROOT_DOMAIN: "portshare.kexoz.dev"

jobs:
  # ── Go CLI binaries (windows/linux/macos × amd64/arm64) ────────────────
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: cli
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          exe=""
          if [ "${{ matrix.goos }}" = "windows" ]; then exe=".exe"; fi
          go build -ldflags "-X portshare/cmd.Version=${{ github.ref_name }}" \
            -o "dist/portshare-${{ matrix.goos }}-${{ matrix.goarch }}${exe}" .

      - name: Upload CLI Asset
        uses: softprops/action-gh-release@v1
        with:
          files: cli/dist/portshare-*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Electron desktop installers (windows/macos/linux × x64/arm64) ──────
  desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
            files: |
              desktop/electron/release-assets/PortShare-windows-x64-setup.exe
          - os: windows-latest
            arch: arm64
            # Squirrel's Setup.exe/RELEASES/nupkg names do not include the
            # architecture, so Windows arm64 ships a portable zip and the x64
            # job owns the Squirrel installer.
            files: |
              desktop/electron/release-assets/PortShare-windows-arm64.zip
          - os: macos-latest
            arch: x64
            files: |
              desktop/electron/release-assets/PortShare-macos-x64.zip
          - os: macos-latest
            arch: arm64
            files: |
              desktop/electron/release-assets/PortShare-macos-arm64.zip
          - os: ubuntu-latest
            arch: x64
            files: |
              desktop/electron/release-assets/portshare-linux-x64.deb
              desktop/electron/release-assets/portshare-linux-x64.rpm
              desktop/electron/release-assets/PortShare-linux-x64.zip
          - os: ubuntu-latest
            arch: arm64
            files: |
              desktop/electron/release-assets/portshare-linux-arm64.deb
              desktop/electron/release-assets/portshare-linux-arm64.rpm
              desktop/electron/release-assets/PortShare-linux-arm64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm zip

      - name: Install Frontend Dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Install Electron Dependencies
        working-directory: desktop/electron
        run: npm ci

      - name: Build Installers (${{ matrix.arch }})
        working-directory: desktop/electron
        run: npm run make -- --arch=${{ matrix.arch }}

      # Electron Forge embeds the version in zip/deb/rpm file names, which
      # prevents the website from using releases/latest/download/<name>.
      # Publish stable, versionless names instead.
      - name: Normalize asset names
        working-directory: desktop/electron
        shell: bash
        run: |
          mkdir -p release-assets
          for f in out/make/zip/*/*/*.zip; do
            [ -e "$f" ] || continue
            case "$f" in
              *win32-x64*)    cp "$f" release-assets/PortShare-windows-x64.zip ;;
              *win32-arm64*)  cp "$f" release-assets/PortShare-windows-arm64.zip ;;
              *darwin-x64*)   cp "$f" release-assets/PortShare-macos-x64.zip ;;
              *darwin-arm64*) cp "$f" release-assets/PortShare-macos-arm64.zip ;;
              *linux-x64*)    cp "$f" release-assets/PortShare-linux-x64.zip ;;
              *linux-arm64*)  cp "$f" release-assets/PortShare-linux-arm64.zip ;;
            esac
          done
          for f in out/make/deb/*/*.deb; do
            [ -e "$f" ] || continue
            case "$f" in
              *_amd64.deb) cp "$f" release-assets/portshare-linux-x64.deb ;;
              *_arm64.deb) cp "$f" release-assets/portshare-linux-arm64.deb ;;
            esac
          done
          for f in out/make/rpm/*/*.rpm; do
            [ -e "$f" ] || continue
            case "$f" in
              *x86_64.rpm) cp "$f" release-assets/portshare-linux-x64.rpm ;;
              *arm64.rpm)  cp "$f" release-assets/portshare-linux-arm64.rpm ;;
            esac
          done
          if [ -f out/make/squirrel.windows/x64/PortShare-Setup.exe ]; then
            cp out/make/squirrel.windows/x64/PortShare-Setup.exe release-assets/PortShare-windows-x64-setup.exe
          fi
          ls -la release-assets

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
