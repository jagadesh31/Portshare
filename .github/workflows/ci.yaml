name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Vet + test server
        working-directory: server
        run: |
          go vet ./...
          go test ./...
      - name: Vet + build CLI
        working-directory: cli
        run: |
          go vet ./...
          go build ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install
        working-directory: desktop/frontend
        run: npm ci
      - name: Lint
        working-directory: desktop/frontend
        run: npm run lint
      - name: Typecheck + build
        working-directory: desktop/frontend
        run: npm run build

  electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/electron/package-lock.json
      - name: Install
        working-directory: desktop/electron
        run: npm ci
      - name: Lint
        working-directory: desktop/electron
        run: npm run lint

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci
      - name: Lint
        working-directory: website
        run: npm run lint
      - name: Build
        working-directory: website
        run: npm run build

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: admin
        run: npm ci
      - name: Lint
        working-directory: admin
        run: npm run lint
      - name: Build
        working-directory: admin
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: https://api.portshare.kexoz.dev
          NEXT_PUBLIC_SITE_URL: https://portshare.kexoz.dev
