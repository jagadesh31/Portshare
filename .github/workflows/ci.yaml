name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Vet + test server
        working-directory: server
        run: |
          go vet ./...
          go test ./...
      - name: Vet + build CLI
        working-directory: cli
        run: |
          go vet ./...
          go build ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install
        working-directory: desktop/frontend
        run: npm ci
      - name: Lint
        working-directory: desktop/frontend
        run: npm run lint
      - name: Typecheck + build
        working-directory: desktop/frontend
        run: npm run build
        env:
          VITE_PORTSHARE_API_BASE: "https://api.portshare.kexoz.dev"
          VITE_PORTSHARE_ROOT_DOMAIN: "portshare.kexoz.dev"

  electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/electron/package-lock.json
      - name: Install
        working-directory: desktop/electron
        run: npm ci
      - name: Lint
        working-directory: desktop/electron
        run: npm run lint

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci
      - name: Lint
        working-directory: website
        run: npm run lint
      - name: Build
        working-directory: website
        run: npm run build
        env:
          NEXT_PUBLIC_PORTSHARE_DOMAIN: portshare.kexoz.dev
          NEXT_PUBLIC_PORTSHARE_API_BASE: https://api.portshare.kexoz.dev
          NEXT_PUBLIC_DESKTOP_DOWNLOAD_URL: https://github.com/jagadesh31/Portshare/releases/latest/download/PortShare-windows-x64-setup.exe
          NEXT_PUBLIC_SAMPLE_SUBDOMAIN: your-service
          NEXT_PUBLIC_SAMPLE_PORT: "3000"

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: admin
        run: npm ci
      - name: Lint
        working-directory: admin
        run: npm run lint
      - name: Build
        working-directory: admin
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: https://api.portshare.kexoz.dev
          NEXT_PUBLIC_SITE_URL: https://portshare.kexoz.dev
